    <main>
      <h1>Kontakta oss</h1>
      <p>Fyll i formuläret nedan, så återkommer vi inom kort!</p>

      <section class="form-section">
        <form action="post">
          <article>
            <label for="name">Namn</label>
            <input type="text" id="name" placeholder="Namn" />
            <label for="email">E-post</label>
            <input type="text" id="email" placeholder="E-post" />
          </article>

          <br />
          <article>
            <select id="issue" name="issue">
              <option value="1">Första alternativet</option>
              <option value="2">Andra alternativet</option>
              <option value="3">Tredje alternativet</option>
            </select>
          </article>
          <br />
          <article>
            <textarea placeholder="Beskriv ditt problem."></textarea>
          </article>

          <article>
            <input type="submit" class="submit-button" value="Skicka" />
          </article>
        </form>
      </section>
    </main>

    <footer>
      <section class="footer-information-section">
        <p>&copy; katttiger | Färgsidan</p>
      </section>

      <section class="footer-information-section">
        <p>
          <a href="tel:+123456789"> Ring oss</a>
